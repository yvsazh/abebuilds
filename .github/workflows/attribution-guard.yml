name: Attribution guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: validate attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect files, commit history, and tags
        run: python3 scripts/repo_guard.py --all-files --all-refs
