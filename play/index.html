<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1d29">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Play the Angry Birds Epic WebGL build in your browser.">
    <title>Angry Birds Epic · Play in Browser</title>
    <link rel="icon" href="../assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="preload" href="../assets/angrybirds-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./player.css?v=4b38ddefd70b4663">
    <script src="./player.js?v=4b38ddefd70b4663" defer></script>
  </head>
  <body>
    <main id="game-shell" aria-label="Angry Birds Epic browser game">
      <div id="safe-area" class="safe-area" aria-hidden="true"></div>
      <div id="game-stage" class="game-stage">
        <canvas id="game-canvas" tabindex="0" aria-label="Game canvas"></canvas>
      </div>

      <section id="start-screen" class="start-screen" aria-live="polite">
        <div class="start-panel">
          <img class="start-logo" src="../assets/art/logo.png" alt="Angry Birds Epic" width="700" height="340">
          <div class="start-card">
            <div class="load-track" role="progressbar" aria-label="Game loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="load-progress"></span></div>
            <p id="load-status" class="load-status">Preparing the game…</p>
            <button id="start-button" class="start-button" type="button" disabled><span>Loading…</span></button>
            <p id="start-hint" class="start-hint">Keep this page open while the game loads.</p>
          </div>
        </div>
      </section>

      <aside id="rotate-screen" class="rotate-screen" aria-live="polite">
        <img src="../assets/ui/art-phone-bird.png" alt="" width="166" height="126">
        <p>Turn your phone sideways</p>
        <small>Angry Birds Epic is played in landscape.</small>
      </aside>

      <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="Enter full screen" title="Full screen" hidden><span></span></button>
      <div id="game-error" class="game-error" role="alert" hidden></div>
    </main>
  </body>
</html>
